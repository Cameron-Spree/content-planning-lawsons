<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawsons Content Engine & Editorial Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">📐</div>
      <div>
        <h1>Lawsons Content Engine & Editorial Planner</h1>
        <p>Topic Clustering, Live Cannibalization Check & Seasonality</p>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-pill">
        <span class="val" id="stat-total-articles">0 / 156</span>
        <span class="lbl">Approved Slots</span>
      </div>
      <div class="stat-pill">
        <span class="val">3 / Week</span>
        <span class="lbl">Cadence (1 per Pillar)</span>
      </div>
      <div class="stat-pill">
        <span class="val" id="stat-easy-count">--</span>
        <span class="lbl">Easy to Rank</span>
      </div>
      <div class="stat-pill">
        <span class="val" id="stat-total-vol">--</span>
        <span class="lbl">Approved Search Vol</span>
      </div>
    </div>
  </header>

  <!-- Toolbar Controls -->
  <div class="toolbar">
    <div class="controls-left">
      <div class="view-toggle">
        <button class="view-btn active" id="btn-view-tinder" onclick="switchView('tinder')">🔥 Decision Deck (Yes/No)</button>
        <button class="view-btn" id="btn-view-calendar" onclick="switchView('calendar')">📅 52-Week Roadmap</button>
        <button class="view-btn" id="btn-view-kanban" onclick="switchView('kanban')">📋 Kanban Board</button>
      </div>

      <!-- Overlap Filter against 370 Live Blogs -->
      <select class="filter-select" id="filter-overlap" onchange="applyFilters()">
        <option value="net-new">🟢 Net-New Opportunities Only (0% Overlap)</option>
        <option value="all">All Topics (New + Refreshes)</option>
        <option value="overlap">🔄 Live Blog Matches (Refresh Potential)</option>
      </select>

      <select class="filter-select" id="filter-difficulty" onchange="applyFilters()">
        <option value="all">All Difficulties</option>
        <option value="Easy to Rank">🟢 Easy to Rank (Low Comp)</option>
        <option value="Moderate">🟡 Moderate Competition</option>
        <option value="Challenging">🔴 High Competition</option>
      </select>

      <select class="filter-select" id="sort-by" onchange="applyFilters()">
        <option value="rankability">Sort: 🌟 Best Rankability First</option>
        <option value="volume">Sort: 📈 Search Volume</option>
        <option value="priority">Sort: 🎯 Priority Score</option>
      </select>

      <input type="text" class="search-input" id="search-kw" placeholder="Search titles or keywords..." oninput="applyFilters()">
    </div>

    <div class="controls-right">
      <button class="btn-action btn-danger" onclick="startFresh()" title="Clear all approved slots and review queues to start completely fresh">
        🔄 Start Fresh
      </button>
      <button class="btn-action btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
      <button class="btn-action btn-secondary" onclick="exportJSON()">💾 Export JSON</button>
    </div>
  </div>

  <!-- Main View -->
  <main id="main-content">
    <!-- Rendered dynamically via app.js -->
  </main>

  <!-- Brief Details Modal -->
  <div class="modal-overlay" id="brief-modal" onclick="closeModalOnOutsideClick(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Article Brief</h2>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" onclick="closeModal()">Close</button>
        <button class="btn-action" id="btn-copy-brief" onclick="copyBriefPayload()">📋 Copy Brief JSON for Generator</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Action completed!</div>

  <script src="app.js"></script>
</body>
</html>
